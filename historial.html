<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Casacas - Historial</title>
  <link rel="stylesheet" href="styles.css">
  <script src="toast.js"></script>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-logo">
      <h2>Casacas</h2>
      <small>y Uniformes</small>
    </div>
    <nav id="nav-menu"></nav>
    <div class="sidebar-footer">
      <div class="sidebar-usuario" id="info-usuario"></div>
      <button class="btn-modo" onclick="toggleModo()">Modo oscuro</button>
      <button class="btn-cerrar-sesion" onclick="cerrarSesion()">Cerrar sesion</button>
    </div>
  </div>

  <div class="contenido">
    <div class="encabezado">
      <h1>Historial de Movimientos</h1>
      <div style="display:flex; gap:10px; align-items:center;">
        <!-- Indicador lector -->
        <div id="lector-status" style="
          display:flex; align-items:center; gap:8px;
          background:var(--card-bg); border:1px solid var(--border);
          padding:8px 14px; border-radius:8px; font-size:13px; color:var(--text-muted);">
          <span id="lector-dot" style="width:8px;height:8px;border-radius:50%;background:#2ecc71;display:inline-block;"></span>
          <span id="lector-texto">Lector listo</span>
        </div>
        <button class="btn btn-rojo" onclick="abrirModalEntrada()">+ Entrada de Stock</button>
      </div>
    </div>

    <div class="filtros">
      <select id="filtro-tipo" onchange="aplicarFiltros()">
        <option value="">Todos los movimientos</option>
        <option value="venta">Ventas</option>
        <option value="entrada">Entradas</option>
      </select>
      <button class="btn-limpiar" onclick="limpiarFiltros()">Limpiar</button>
    </div>

    <p id="contador" style="margin-bottom:12px; color:#888; font-size:14px;"></p>

    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Tipo</th>
          <th>Producto</th>
          <th>Cantidad</th>
          <th>Usuario</th>
          <th>Nota</th>
        </tr>
      </thead>
      <tbody id="tabla-body">
        <tr><td colspan="6" class="vacio">Cargando...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- MODAL ENTRADA DE STOCK -->
  <div class="modal-overlay" id="modal-entrada">
    <div class="modal">
      <h2>Entrada de Stock</h2>

      <div class="campo">
        <label>Producto <small style="color:var(--text-muted); font-weight:normal;">(o escanea con el lector)</small></label>
        <select id="e-producto"></select>
      </div>

      <div class="fila-doble">
        <div class="campo">
          <label>Cantidad a agregar</label>
          <input type="number" id="e-cantidad" min="1" value="1">
        </div>
        <div class="campo">
          <label>Nota (opcional)</label>
          <input type="text" id="e-nota" placeholder="Ej: Pedido llego">
        </div>
      </div>

      <div class="modal-botones">
        <button class="btn btn-gris" onclick="cerrarModalEntrada()">Cancelar</button>
        <button class="btn btn-rojo" onclick="guardarEntrada()">Guardar</button>
      </div>
    </div>
  </div>

  <script src="nav.js"></script>
  <script>
    let sesion      = null
    let movimientos = []
    let productos   = []

    // ── LECTOR DE CODIGO DE BARRAS ────────────────────
    let bufferLector = ''
    let timerLector  = null
    const VELOCIDAD_LECTOR = 50

    document.addEventListener('keydown', (e) => {
      const tag = document.activeElement.tagName
      // Si el modal de entrada está abierto, el lector selecciona el producto automáticamente
      const modalAbierto = document.getElementById('modal-entrada').classList.contains('activo')

      if (tag === 'INPUT' || tag === 'TEXTAREA') return
      // En SELECT también ignoramos escritura normal, pero capturamos el lector
      if (tag === 'SELECT' && !modalAbierto) return

      if (e.key === 'Enter') {
        if (bufferLector.length >= 8) {
          procesarCodigoLector(bufferLector, modalAbierto)
        }
        bufferLector = ''
        clearTimeout(timerLector)
        return
      }

      if (e.key.length === 1) {
        bufferLector += e.key
        clearTimeout(timerLector)
        timerLector = setTimeout(() => { bufferLector = '' }, VELOCIDAD_LECTOR * 10)
      }
    })

    async function procesarCodigoLector(codigo, abrirModal) {
      mostrarLectorStatus(`Buscando: ${codigo}`, '#f39c12')
      const variante = await ipcRenderer.invoke('buscar-por-codigo', codigo)

      if (!variante) {
        mostrarLectorStatus('Codigo no encontrado', '#e94560')
        setTimeout(() => mostrarLectorStatus('Lector listo', '#2ecc71'), 2000)
        return
      }

      // Seleccionar el producto en el select del modal
      const select = document.getElementById('e-producto')
      select.value = variante.id

      if (!abrirModal) {
        // Si el modal no está abierto, abrirlo con ese producto preseleccionado
        abrirModalEntrada()
        select.value = variante.id
      }

      mostrarLectorStatus(`Seleccionado: ${variante.nombre} T${variante.talla}`, '#2ecc71')
      setTimeout(() => mostrarLectorStatus('Lector listo', '#2ecc71'), 2000)

      // Enfocar cantidad para que el usuario la escriba directo
      setTimeout(() => document.getElementById('e-cantidad').focus(), 200)
    }

    function mostrarLectorStatus(texto, color) {
      document.getElementById('lector-texto').textContent = texto
      document.getElementById('lector-dot').style.background = color
    }
    // ─────────────────────────────────────────────────

    cargarMenu('historial.html').then(s => {
      sesion = s
      cargarDatos()
    })

    async function cargarDatos() {
      movimientos = await ipcRenderer.invoke('obtener-movimientos')
      productos   = await ipcRenderer.invoke('obtener-productos')

      const select = document.getElementById('e-producto')
      select.innerHTML = ''
      productos.forEach(p => {
        if (!p.variantes) return
        p.variantes.forEach(v => {
          const opt = document.createElement('option')
          opt.value = v.id
          opt.textContent = `${p.nombre} — T${v.talla} — ${p.colegio} (Stock: ${v.cantidad})`
          select.appendChild(opt)
        })
      })

      aplicarFiltros()
    }

    function aplicarFiltros() {
      const tipo      = document.getElementById('filtro-tipo').value
      const filtrados = movimientos.filter(m => !tipo || m.tipo === tipo)
      document.getElementById('contador').textContent =
        `Mostrando ${filtrados.length} de ${movimientos.length} movimientos`
      renderTabla(filtrados)
    }

    function limpiarFiltros() {
      document.getElementById('filtro-tipo').value = ''
      aplicarFiltros()
    }

    function renderTabla(lista) {
      const tbody = document.getElementById('tabla-body')
      if (lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="vacio">No hay movimientos aun.</td></tr>'
        return
      }
      tbody.innerHTML = lista.map(m => `
        <tr>
          <td>${new Date(m.fecha).toLocaleString('es-CO')}</td>
          <td>
            <span class="badge ${m.tipo === 'venta' ? 'badge-rojo' : 'badge-verde'}">
              ${m.tipo === 'venta' ? 'Venta' : 'Entrada'}
            </span>
          </td>
          <td>${m.producto} ${m.talla ? '— T' + m.talla : ''}</td>
          <td>${m.tipo === 'venta' ? '-' : '+'}${m.cantidad}</td>
          <td>${m.usuario}</td>
          <td>${m.nota || '—'}</td>
        </tr>
      `).join('')
    }

    function abrirModalEntrada() {
      document.getElementById('e-cantidad').value = 1
      document.getElementById('e-nota').value     = ''
      document.getElementById('modal-entrada').classList.add('activo')
    }

    function cerrarModalEntrada() {
      document.getElementById('modal-entrada').classList.remove('activo')
    }

    async function guardarEntrada() {
      const productoId = parseInt(document.getElementById('e-producto').value)
      const cantidad   = parseInt(document.getElementById('e-cantidad').value)
      const nota       = document.getElementById('e-nota').value.trim()

      if (!productoId || cantidad < 1) { alert('Completa los campos correctamente'); return }

      await ipcRenderer.invoke('agregar-movimiento', {
        variante_id: productoId,
        usuario_id:  sesion.id,
        tipo:        'entrada',
        cantidad,
        nota: nota || 'Entrada de stock'
      })

      cerrarModalEntrada()
      cargarDatos()
    }
  </script>

</body>
</html>
