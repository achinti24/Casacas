<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Casacas - Metas</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="dashboard.css">
  <script src="toast.js"></script>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-logo">
      <h2>Casacas</h2>
      <small>y Uniformes</small>
    </div>
    <nav id="nav-menu"></nav>
    <div class="sidebar-footer">
      <div class="sidebar-usuario" id="info-usuario"></div>
      <button class="btn-modo" onclick="toggleModo()">Modo oscuro</button>
      <button class="btn-cerrar-sesion" onclick="cerrarSesion()">Cerrar sesion</button>
    </div>
  </div>

  <div class="contenido">
    <div class="encabezado">
      <h1>Metas de Ventas</h1>
    </div>

    <!-- CONFIGURAR METAS -->
    <div class="panel" style="margin-bottom:20px;">
      <h3 style="margin-bottom:16px;">Configurar Metas</h3>
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px;">

        <div class="campo">
          <label>Meta diaria ($)</label>
          <div style="display:flex; gap:8px;">
            <input type="number" id="meta-dia" min="0" value="0"
              style="flex:1; padding:10px; border:1px solid #ddd; border-radius:8px; font-size:15px;">
            <button class="btn btn-rojo" onclick="guardarMeta('dia')">Guardar</button>
          </div>
        </div>

        <div class="campo">
          <label>Meta semanal ($)</label>
          <div style="display:flex; gap:8px;">
            <input type="number" id="meta-semana" min="0" value="0"
              style="flex:1; padding:10px; border:1px solid #ddd; border-radius:8px; font-size:15px;">
            <button class="btn btn-rojo" onclick="guardarMeta('semana')">Guardar</button>
          </div>
        </div>

        <div class="campo">
          <label>Meta mensual ($)</label>
          <div style="display:flex; gap:8px;">
            <input type="number" id="meta-mes" min="0" value="0"
              style="flex:1; padding:10px; border:1px solid #ddd; border-radius:8px; font-size:15px;">
            <button class="btn btn-rojo" onclick="guardarMeta('mes')">Guardar</button>
          </div>
        </div>

      </div>
    </div>

    <!-- PROGRESO ACTUAL -->
    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; margin-bottom:20px;">

      <div class="panel">
        <h3 style="margin-bottom:16px;">Hoy</h3>
        <div style="text-align:center; margin-bottom:16px;">
          <div style="font-size:28px; font-weight:bold; color:#1a1a2e;" id="venta-hoy">$0</div>
          <div style="font-size:14px; color:#888; margin-top:4px;">de <span id="meta-hoy-display">$0</span></div>
        </div>
        <div class="barra-contenedor">
          <div class="barra-progreso" id="barra-dia"></div>
        </div>
        <div style="text-align:center; margin-top:10px;">
          <span id="badge-dia" class="badge">0%</span>
        </div>
      </div>

      <div class="panel">
        <h3 style="margin-bottom:16px;">Esta semana</h3>
        <div style="text-align:center; margin-bottom:16px;">
          <div style="font-size:28px; font-weight:bold; color:#1a1a2e;" id="venta-semana">$0</div>
          <div style="font-size:14px; color:#888; margin-top:4px;">de <span id="meta-semana-display">$0</span></div>
        </div>
        <div class="barra-contenedor">
          <div class="barra-progreso" id="barra-semana"></div>
        </div>
        <div style="text-align:center; margin-top:10px;">
          <span id="badge-semana" class="badge">0%</span>
        </div>
      </div>

      <div class="panel">
        <h3 style="margin-bottom:16px;">Este mes</h3>
        <div style="text-align:center; margin-bottom:16px;">
          <div style="font-size:28px; font-weight:bold; color:#1a1a2e;" id="venta-mes">$0</div>
          <div style="font-size:14px; color:#888; margin-top:4px;">de <span id="meta-mes-display">$0</span></div>
        </div>
        <div class="barra-contenedor">
          <div class="barra-progreso" id="barra-mes"></div>
        </div>
        <div style="text-align:center; margin-top:10px;">
          <span id="badge-mes" class="badge">0%</span>
        </div>
      </div>

    </div>

    <!-- GRAFICA MENSUAL -->
    <div class="panel">
      <h3 style="margin-bottom:16px;">Ventas vs Egresos por mes</h3>
      <canvas id="grafica-meses" height="120"></canvas>
    </div>

    <!-- TABLA MESES -->
    <div class="panel" style="margin-top:20px;">
      <h3 style="margin-bottom:16px;">Resumen por mes</h3>
      <table>
        <thead>
          <tr>
            <th>Mes</th>
            <th>Ventas</th>
            <th>Cantidad ventas</th>
            <th>Egresos</th>
            <th>Balance</th>
            <th>Meta</th>
            <th>Cumplimiento</th>
          </tr>
        </thead>
        <tbody id="tabla-meses">
          <tr><td colspan="7" class="vacio">Cargando...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script src="nav.js"></script>
  <script src="node_modules/chart.js/dist/chart.umd.js"></script>
  <script>
    let sesion = null
    let metas  = []
    let graficaMeses = null

    const MESES_NOMBRES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                           'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']

    cargarMenu('metas.html').then(s => {
      sesion = s
      if (sesion && sesion.rol !== 'admin') navegar('index.html')
      cargarDatos()
    })

    async function cargarDatos() {
      metas = await ipcRenderer.invoke('obtener-metas')
      const estadisticas = await ipcRenderer.invoke('obtener-estadisticas')
      const ventas       = await ipcRenderer.invoke('obtener-ventas')
      const egresos      = await ipcRenderer.invoke('obtener-egresos')

      // Llenar inputs de metas
      metas.forEach(m => {
        const el = document.getElementById(`meta-${m.tipo}`)
        if (el) el.value = m.monto
      })

      // Calcular ventas actuales
      const ahora    = new Date()
      const hoy      = ahora.toISOString().slice(0, 10)
      const mesAct   = ahora.toISOString().slice(0, 7)

      const inicioSemana = new Date(ahora)
      inicioSemana.setDate(ahora.getDate() - ahora.getDay() + 1)
      const inicioSemanaStr = inicioSemana.toISOString().slice(0, 10)

      const ventaHoy    = ventas.filter(v => v.fecha.slice(0, 10) === hoy).reduce((a, v) => a + v.total, 0)
      const ventaSemana = ventas.filter(v => v.fecha.slice(0, 10) >= inicioSemanaStr).reduce((a, v) => a + v.total, 0)
      const ventaMes    = ventas.filter(v => v.fecha.slice(0, 7) === mesAct).reduce((a, v) => a + v.total, 0)

      const metaDia    = metas.find(m => m.tipo === 'dia')?.monto    || 0
      const metaSemana = metas.find(m => m.tipo === 'semana')?.monto || 0
      const metaMes    = metas.find(m => m.tipo === 'mes')?.monto    || 0

      document.getElementById('venta-hoy').textContent     = '$' + ventaHoy.toLocaleString('es-CO')
      document.getElementById('venta-semana').textContent  = '$' + ventaSemana.toLocaleString('es-CO')
      document.getElementById('venta-mes').textContent     = '$' + ventaMes.toLocaleString('es-CO')
      document.getElementById('meta-hoy-display').textContent    = '$' + metaDia.toLocaleString('es-CO')
      document.getElementById('meta-semana-display').textContent = '$' + metaSemana.toLocaleString('es-CO')
      document.getElementById('meta-mes-display').textContent    = '$' + metaMes.toLocaleString('es-CO')

      actualizarBarra('dia',    ventaHoy,    metaDia)
      actualizarBarra('semana', ventaSemana, metaSemana)
      actualizarBarra('mes',    ventaMes,    metaMes)

      // Grafica y tabla mensual
      renderResumenMeses(estadisticas, egresos, metaMes)
    }

    function actualizarBarra(tipo, vendido, meta) {
      const pct   = meta > 0 ? Math.min(100, Math.round((vendido / meta) * 100)) : 0
      const barra = document.getElementById(`barra-${tipo}`)
      const badge = document.getElementById(`badge-${tipo}`)

      barra.style.width = pct + '%'
      barra.style.background = pct >= 100 ? '#2ecc71' : pct >= 60 ? '#f39c12' : '#e94560'

      badge.textContent = pct + '%'
      badge.className = 'badge ' + (pct >= 100 ? 'badge-verde' : pct >= 60 ? 'badge-amarillo' : 'badge-rojo')
    }

    function renderResumenMeses(estadisticas, egresos, metaMes) {
      const mesesData = estadisticas.resumenMeses || []
      const egresosMap = {}
      ;(estadisticas.egresosPorMes || []).forEach(e => { egresosMap[e.periodo] = e.egresos })

      const labels   = mesesData.map(m => MESES_NOMBRES[parseInt(m.mes) - 1] + ' ' + m.anio)
      const ingresos = mesesData.map(m => m.ingresos || 0)
      const egresosList = mesesData.map(m => egresosMap[m.periodo] || 0)
      const balances = ingresos.map((ing, i) => ing - egresosList[i])

      if (graficaMeses) graficaMeses.destroy()
      const ctx = document.getElementById('grafica-meses').getContext('2d')
      graficaMeses = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            {
              label: 'Ingresos',
              data: ingresos,
              backgroundColor: '#2ecc7188',
              borderColor: '#2ecc71',
              borderWidth: 2,
              borderRadius: 6,
            },
            {
              label: 'Egresos',
              data: egresosList,
              backgroundColor: '#e9456088',
              borderColor: '#e94560',
              borderWidth: 2,
              borderRadius: 6,
            },
            {
              label: 'Balance',
              data: balances,
              type: 'line',
              borderColor: '#3498db',
              backgroundColor: '#3498db22',
              borderWidth: 2,
              pointRadius: 4,
              fill: false,
            }
          ]
        },
        options: {
          responsive: true,
          plugins: { legend: { position: 'top' } },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { callback: v => '$' + v.toLocaleString('es-CO') }
            }
          }
        }
      })

      // Tabla
      const tbody = document.getElementById('tabla-meses')
      if (mesesData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="vacio">Sin datos aun</td></tr>'
        return
      }

      tbody.innerHTML = mesesData.map((m, i) => {
        const egreso  = egresosList[i]
        const balance = ingresos[i] - egreso
        const pct     = metaMes > 0 ? Math.round((ingresos[i] / metaMes) * 100) : 0
        const cumple  = metaMes > 0 && ingresos[i] >= metaMes

        return `
          <tr>
            <td><strong>${MESES_NOMBRES[parseInt(m.mes) - 1]} ${m.anio}</strong></td>
            <td><strong style="color:#2ecc71;">$${parseFloat(ingresos[i]).toLocaleString('es-CO')}</strong></td>
            <td>${m.ventas}</td>
            <td style="color:#e94560;">$${parseFloat(egreso).toLocaleString('es-CO')}</td>
            <td>
              <strong style="color:${balance >= 0 ? '#2ecc71' : '#e94560'};">
                ${balance >= 0 ? '+' : ''}$${parseFloat(balance).toLocaleString('es-CO')}
              </strong>
            </td>
            <td>$${parseFloat(metaMes).toLocaleString('es-CO')}</td>
            <td>
              <span class="badge ${cumple ? 'badge-verde' : pct >= 60 ? 'badge-amarillo' : 'badge-rojo'}">
                ${metaMes > 0 ? pct + '%' : 'Sin meta'}
                ${cumple ? ' Cumplida' : ''}
              </span>
            </td>
          </tr>
        `
      }).join('')
    }

    async function guardarMeta(tipo) {
      const monto = parseFloat(document.getElementById(`meta-${tipo}`).value) || 0
      await ipcRenderer.invoke('guardar-meta', { tipo, monto })
      alert(`Meta ${tipo === 'dia' ? 'diaria' : tipo === 'semana' ? 'semanal' : 'mensual'} guardada`)
      cargarDatos()
    }
  </script>

</body>
</html>
