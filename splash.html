<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Casacas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.8s ease forwards;
    }

    .logo-img {
      width: 280px;
      border-radius: 20px;
      box-shadow: 0 0 60px rgba(233, 69, 96, 0.4);
      animation: glow 2s ease-in-out infinite alternate;
    }

    .subtitulo {
      color: #aaa;
      font-size: 15px;
      margin-top: 20px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .barra-carga {
      width: 280px;
      height: 3px;
      background: #ffffff22;
      border-radius: 10px;
      margin-top: 40px;
      overflow: hidden;
    }

    .barra-progreso {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      border-radius: 10px;
      animation: cargar 2s ease forwards;
    }

    .version {
      color: #555;
      font-size: 12px;
      margin-top: 20px;
      letter-spacing: 1px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes glow {
      from { box-shadow: 0 0 30px rgba(233, 69, 96, 0.3); }
      to   { box-shadow: 0 0 70px rgba(233, 69, 96, 0.6); }
    }

    @keyframes cargar {
      0%   { width: 0%; }
      30%  { width: 40%; }
      70%  { width: 75%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img class="logo-img" src="assets/casacas.jpg" alt="Casacas y Uniformes">
    <p class="subtitulo">Sistema de Inventario</p>
    <div class="barra-carga">
      <div class="barra-progreso"></div>
    </div>
    <p class="version">v2.0.1</p>
  </div>
</body>
</html>
