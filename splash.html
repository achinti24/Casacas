<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Casacas</title>
  <style>
    @font-face {
      font-family: "Geist";
      src: url("assets/fonts/geist-variable.woff2") format("woff2");
      font-weight: 100 900;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: "Geist", "Segoe UI", sans-serif;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: aparecer 0.6s ease forwards;
    }

    .logo-img {
      width: 240px;
      border-radius: 12px;
    }

    .subtitulo {
      color: #a3a3a3;
      font-size: 14px;
      margin-top: 20px;
    }

    .barra-carga {
      width: 240px;
      height: 2px;
      background: #262626;
      border-radius: 999px;
      margin-top: 32px;
      overflow: hidden;
    }

    .barra-progreso {
      height: 100%;
      width: 0%;
      background: #f2f2f2;
      animation: cargar 2.4s ease forwards;
    }

    .version {
      color: #737373;
      font-size: 12px;
      margin-top: 16px;
      font-variant-numeric: tabular-nums;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes cargar {
      0%   { width: 0%; }
      30%  { width: 40%; }
      70%  { width: 75%; }
      100% { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-container, .barra-progreso { animation: none; }
      .barra-progreso { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img class="logo-img" src="assets/casacas.jpg" alt="Casacas y Uniformes">
    <p class="subtitulo">Inventario y ventas · San Gil</p>
    <div class="barra-carga">
      <div class="barra-progreso"></div>
    </div>
    <p class="version">v2.1.0</p>
  </div>
</body>
</html>
